[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "moviefilter"
dynamic = ["version"]
description = "Remove profanity from movie audio while keeping the music and sound effects, as an extra audio track for Plex."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "faster-whisper>=1.0",
    "demucs>=4.0",
    "torch>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7", "soundfile>=0.12"]

[project.scripts]
moviefilter = "moviefilter.cli:main"

[tool.setuptools]
packages = ["moviefilter"]

[tool.setuptools.dynamic]
version = { attr = "moviefilter.__version__" }

[tool.setuptools.package-data]
moviefilter = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real Whisper/Demucs integration tests (run with --slow)"]
